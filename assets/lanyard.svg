<svg width="450" height="580" viewBox="0 0 450 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Strap Gradient -->
    <linearGradient id="strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>

    <!-- Card Background Glass Gradient -->
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.98" />
    </linearGradient>

    <!-- Holographic Shine Gradient -->
    <linearGradient id="holo-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0" />
      <stop offset="40%" stop-color="#00FF88" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#B026FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0" />
    </linearGradient>

    <!-- Metal Clasp Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D0D7DE" />
      <stop offset="50%" stop-color="#6E7681" />
      <stop offset="100%" stop-color="#30363D" />
    </linearGradient>

    <!-- Avatar Glow Filter -->
    <filter id="avatar-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Pendulum Physics Swing Animation */
    @keyframes pendulum-swing {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(4deg); }
      40% { transform: rotate(-3.5deg); }
      60% { transform: rotate(2deg); }
      80% { transform: rotate(-1.5deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes gentle-sway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }

    @keyframes holo-sweep {
      0% { transform: translateX(-300px) translateY(-300px) rotate(45deg); }
      50%, 100% { transform: translateX(500px) translateY(500px) rotate(45deg); }
    }

    @keyframes ring-pulse {
      0%, 100% { stroke-opacity: 0.6; stroke-width: 3; }
      50% { stroke-opacity: 1; stroke-width: 4.5; }
    }

    .lanyard-assembly {
      transform-origin: 225px 0px;
      animation: gentle-sway 4s ease-in-out infinite;
    }

    .holo-layer {
      animation: holo-sweep 6s ease-in-out infinite;
    }

    .avatar-ring {
      animation: ring-pulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Entire Lanyard Assembly -->
  <g class="lanyard-assembly">
    <!-- Top Hanging Strap Left -->
    <path d="M 185 0 L 210 110 L 220 110 L 195 0 Z" fill="url(#strap-grad)" opacity="0.9"/>
    <!-- Top Hanging Strap Right -->
    <path d="M 265 0 L 240 110 L 230 110 L 255 0 Z" fill="url(#strap-grad)" opacity="0.9"/>
    
    <!-- Strap Print Text -->
    <text x="180" y="55" fill="#000" font-family="'Fira Code', monospace" font-size="10" font-weight="900" transform="rotate(78 180 55)">SOUMOJIT // DEV</text>
    <text x="260" y="55" fill="#000" font-family="'Fira Code', monospace" font-size="10" font-weight="900" transform="rotate(-78 260 55)">SOUMOJIT // DEV</text>

    <!-- Metal Clasp & Buckle -->
    <rect x="208" y="105" width="34" height="24" rx="4" fill="url(#metal-grad)" stroke="#00FF88" stroke-width="1"/>
    <circle cx="225" cy="138" r="12" fill="none" stroke="url(#metal-grad)" stroke-width="4.5"/>
    <rect x="220" y="148" width="10" height="15" rx="2" fill="url(#metal-grad)"/>

    <!-- Hanging ID Badge Glass Card Container -->
    <g transform="translate(75, 160)">
      <!-- Card Shadow & Border -->
      <rect x="0" y="0" width="300" height="400" rx="20" fill="#05080C" filter="drop-shadow(0 15px 25px rgba(0,255,136,0.15))"/>
      <rect x="0" y="0" width="300" height="400" rx="20" fill="url(#card-glass)" stroke="#00FF88" stroke-width="1.8" stroke-opacity="0.5"/>

      <!-- Card Top Lanyard Slot -->
      <rect x="125" y="12" width="50" height="8" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

      <!-- Header Chip / Logo -->
      <text x="30" y="45" fill="#00FF88" font-family="'Fira Code', monospace" font-size="13" font-weight="800">⚡ VERIFIED DEV_ID</text>
      <text x="270" y="45" text-anchor="end" fill="#8B949E" font-family="'Fira Code', monospace" font-size="11">#4096</text>

      <line x1="30" y1="58" x2="270" y2="58" stroke="#30363D" stroke-width="1"/>

      <!-- Avatar Ring & Icon -->
      <g transform="translate(150, 135)">
        <circle cx="0" cy="0" r="52" fill="#090D14" stroke="#00E5FF" stroke-width="2"/>
        <circle class="avatar-ring" cx="0" cy="0" r="48" fill="none" stroke="#00FF88" stroke-width="3" filter="url(#avatar-glow)"/>
        
        <!-- Developer Icon Silhouette / Avatar -->
        <circle cx="0" cy="-12" r="18" fill="#00FF88"/>
        <path d="M -30 25 C -30 5, 30 5, 30 25 Z" fill="#00FF88"/>
        <text x="0" y="4" text-anchor="middle" fill="#05080C" font-family="'Fira Code', monospace" font-size="16" font-weight="900">&lt;/&gt;</text>
      </g>

      <!-- Developer Name & Titles -->
      <text x="150" y="222" text-anchor="middle" fill="#E6EDF3" font-family="'Inter', sans-serif" font-size="22" font-weight="900" letter-spacing="1">SOUMOJIT PAUL</text>
      <text x="150" y="245" text-anchor="middle" fill="#00FF88" font-family="'Fira Code', monospace" font-size="12" font-weight="700">FULL STACK &amp; 3D WEB ENGINEER</text>
      <text x="150" y="265" text-anchor="middle" fill="#8B949E" font-family="'Fira Code', monospace" font-size="12">@psoumojit40</text>

      <line x1="40" y1="285" x2="260" y2="285" stroke="#30363D" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- Key Skill Tags inside Badge -->
      <rect x="35" y="300" width="70" height="24" rx="6" fill="#0D1117" stroke="#00FF88" stroke-opacity="0.4"/>
      <text x="70" y="316" text-anchor="middle" fill="#00FF88" font-family="'Fira Code', monospace" font-size="10" font-weight="700">React</text>

      <rect x="115" y="300" width="70" height="24" rx="6" fill="#0D1117" stroke="#00E5FF" stroke-opacity="0.4"/>
      <text x="150" y="316" text-anchor="middle" fill="#00E5FF" font-family="'Fira Code', monospace" font-size="10" font-weight="700">Next.js</text>

      <rect x="195" y="300" width="70" height="24" rx="6" fill="#0D1117" stroke="#B026FF" stroke-opacity="0.4"/>
      <text x="230" y="316" text-anchor="middle" fill="#B026FF" font-family="'Fira Code', monospace" font-size="10" font-weight="700">Three.js</text>

      <!-- Barcode Graphic -->
      <g transform="translate(45, 345)">
        <rect x="0" y="0" width="3" height="30" fill="#E6EDF3"/>
        <rect x="5" y="0" width="1" height="30" fill="#E6EDF3"/>
        <rect x="8" y="0" width="4" height="30" fill="#E6EDF3"/>
        <rect x="15" y="0" width="2" height="30" fill="#E6EDF3"/>
        <rect x="19" y="0" width="1" height="30" fill="#E6EDF3"/>
        <rect x="22" y="0" width="5" height="30" fill="#E6EDF3"/>
        <rect x="30" y="0" width="2" height="30" fill="#E6EDF3"/>
        <rect x="34" y="0" width="4" height="30" fill="#E6EDF3"/>
        <rect x="40" y="0" width="1" height="30" fill="#E6EDF3"/>
        <rect x="43" y="0" width="3" height="30" fill="#E6EDF3"/>
        <rect x="48" y="0" width="6" height="30" fill="#E6EDF3"/>
        <rect x="56" y="0" width="2" height="30" fill="#E6EDF3"/>
        <rect x="60" y="0" width="1" height="30" fill="#E6EDF3"/>
        <rect x="63" y="0" width="4" height="30" fill="#E6EDF3"/>
        <rect x="69" y="0" width="2" height="30" fill="#E6EDF3"/>
        <rect x="73" y="0" width="5" height="30" fill="#E6EDF3"/>
        <rect x="80" y="0" width="1" height="30" fill="#E6EDF3"/>
        <rect x="83" y="0" width="3" height="30" fill="#E6EDF3"/>
        <rect x="88" y="0" width="2" height="30" fill="#E6EDF3"/>
        <rect x="92" y="0" width="4" height="30" fill="#E6EDF3"/>
        <rect x="98" y="0" width="1" height="30" fill="#E6EDF3"/>
        <rect x="101" y="0" width="5" height="30" fill="#E6EDF3"/>
        <rect x="108" y="0" width="2" height="30" fill="#E6EDF3"/>
        <rect x="112" y="0" width="3" height="30" fill="#E6EDF3"/>
        <rect x="117" y="0" width="1" height="30" fill="#E6EDF3"/>
        <rect x="120" y="0" width="4" height="30" fill="#E6EDF3"/>
        <rect x="126" y="0" width="2" height="30" fill="#E6EDF3"/>
        <rect x="130" y="0" width="6" height="30" fill="#E6EDF3"/>
        <rect x="138" y="0" width="1" height="30" fill="#E6EDF3"/>
        <rect x="141" y="0" width="3" height="30" fill="#E6EDF3"/>
        <rect x="146" y="0" width="2" height="30" fill="#E6EDF3"/>
        <rect x="150" y="0" width="5" height="30" fill="#E6EDF3"/>
        <rect x="157" y="0" width="1" height="30" fill="#E6EDF3"/>
        <rect x="160" y="0" width="4" height="30" fill="#E6EDF3"/>
        <rect x="166" y="0" width="2" height="30" fill="#E6EDF3"/>
        <rect x="170" y="0" width="3" height="30" fill="#E6EDF3"/>
        <rect x="175" y="0" width="1" height="30" fill="#E6EDF3"/>
        <rect x="178" y="0" width="5" height="30" fill="#E6EDF3"/>
        <rect x="185" y="0" width="2" height="30" fill="#E6EDF3"/>
        <rect x="189" y="0" width="4" height="30" fill="#E6EDF3"/>
        <rect x="195" y="0" width="1" height="30" fill="#E6EDF3"/>
        <rect x="198" y="0" width="3" height="30" fill="#E6EDF3"/>
        <rect x="203" y="0" width="6" height="30" fill="#E6EDF3"/>
      </g>

      <!-- Holographic Sweep Overlay -->
      <g clip-path="url(#badge-clip)">
        <rect class="holo-layer" x="-100" y="-100" width="250" height="600" fill="url(#holo-shine)"/>
      </g>
    </g>
  </g>
</svg>
