<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 1600 40">

<defs>

<linearGradient id="g">

<stop offset="0%" stop-color="#00ff88"/>

<stop offset="50%" stop-color="#00e5ff"/>

<stop offset="100%" stop-color="#00ff88"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur stdDeviation="2"/>

</filter>

</defs>

<rect
width="1600"
height="40"
fill="transparent"/>

<line
x1="100"
y1="20"
x2="1500"
y2="20"
stroke="url(#g)"
stroke-width="3"
filter="url(#glow)">

<animate
attributeName="stroke-dashoffset"
from="100"
to="0"
dur="6s"
repeatCount="indefinite"/>

</line>

</svg>