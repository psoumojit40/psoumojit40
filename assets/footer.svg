<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" width="1600" height="220">
<defs>
<linearGradient id="bg" x1="0" x2="1">
<stop offset="0%" stop-color="#050505"/>
<stop offset="100%" stop-color="#0d1117"/>
</linearGradient>
<linearGradient id="g" x1="0" x2="1">
<stop offset="0%" stop-color="#00ff88"/>
<stop offset="100%" stop-color="#00e5ff"/>
</linearGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="3"/>
</filter>
</defs>

<rect width="1600" height="220" fill="url(#bg)"/>

<g opacity=".15" stroke="#00ff88">
<line x1="0" y1="20" x2="1600" y2="20"/>
<line x1="0" y1="40" x2="1600" y2="40"/>
<line x1="0" y1="60" x2="1600" y2="60"/>
<line x1="0" y1="80" x2="1600" y2="80"/>
<line x1="0" y1="100" x2="1600" y2="100"/>
<line x1="0" y1="120" x2="1600" y2="120"/>
<line x1="0" y1="140" x2="1600" y2="140"/>
<line x1="0" y1="160" x2="1600" y2="160"/>
<line x1="0" y1="180" x2="1600" y2="180"/>
<line x1="0" y1="200" x2="1600" y2="200"/>
<line x1="0" y1="220" x2="1600" y2="220"/>
</g>

<path d="M0 150 C250 90 450 210 700 150 S1150 90 1600 150"
stroke="url(#g)" stroke-width="4" fill="none" filter="url(#glow)">
<animate attributeName="d"
dur="8s"
repeatCount="indefinite"
values="
M0 150 C250 90 450 210 700 150 S1150 90 1600 150;
M0 145 C250 180 450 80 700 145 S1150 190 1600 145;
M0 150 C250 90 450 210 700 150 S1150 90 1600 150"/>
</path>

<text x="800" y="95" text-anchor="middle"
font-family="Segoe UI,Arial"
font-size="30"
fill="#ffffff"
font-weight="700">
Thanks for visiting my profile.
</text>

<text x="800" y="135"
text-anchor="middle"
font-family="Consolas"
font-size="18"
fill="#00ff88">
See you in the next commit.
</text>

<circle cx="640" cy="170" r="3" fill="#00ff88">
<animate attributeName="cx" values="640;960;640" dur="6s" repeatCount="indefinite"/>
</circle>

<circle cx="960" cy="170" r="3" fill="#00e5ff">
<animate attributeName="cx" values="960;640;960" dur="6s" repeatCount="indefinite"/>
</circle>

</svg>
